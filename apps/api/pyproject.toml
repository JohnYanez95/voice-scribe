[project]
name = "voice-scribe-api"
version = "0.1.0"
description = "Local speech-to-text API for Voice Scribe"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Bare-host GPU runs only (Docker ships its own CUDA runtime). These wheels are
# what LD_LIBRARY_PATH must point at — without them the model loads and the
# first decode fails with "Library libcublas.so.12 is not found".
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
