services:
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.cpu
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Host-IP prefix is load-bearing — see compose.dev.yml note.
      - "127.0.0.1:${API_PORT:-8084}:8000"
    environment:
      - WHISPER_MODEL=small
      - WHISPER_AVAILABLE_MODELS=small
      - DEVICE=cpu
      - MAX_AUDIO_SECONDS=60
      - MAX_UPLOAD_MB=10
      - CORS_ORIGINS=http://localhost:${WEB_PORT:-5174},http://127.0.0.1:${WEB_PORT:-5174}
      - MODEL_CACHE_DIR=/cache
      - TEMP_DIR=/tmp/voice-scribe
      - LOG_LEVEL=info
      - HF_HUB_DISABLE_XET=1
    volumes:
      - ../../data/cache:/cache
      - ../../data/tmp:/tmp/voice-scribe
