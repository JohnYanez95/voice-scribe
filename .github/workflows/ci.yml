name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  backend:
    name: Backend (lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .[dev]
      - run: python -m pytest tests/ -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t voice-scribe-api apps/api

  # Desktop shell is FROZEN (2026-08-04 scope decision, roadmap) — this job is
  # the freeze insurance: it proves the crate still compiles against a current
  # toolchain, not that features work. Drop it if it exceeds ~2 min cached.
  desktop-check:
    name: Desktop shell (cargo check — freeze insurance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features
